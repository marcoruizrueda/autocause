[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autocause"
version = "0.2.0"
description = "Multi-method causal discovery framework for time series with pre-discovery diagnostics"
authors = [{name = "Marco Ruiz", email = "marco.rueda@tecnico.ulisboa.pt"}]
license = {text = "AGPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.13"
keywords = ["causal-discovery", "time-series", "granger", "pcmci", "transfer-entropy", "tigramite", "pre-discovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pandas>=2.1,<3",
    "numpy>=2.0,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "statsmodels>=0.13,<1",
    "tigramite>=5.2.8",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "python-dateutil>=2.8",
    "pyarrow>=14.0",
    "plotly>=5.0",
    "dcor>=0.6",
    "lingam>=1.8",
    "SciencePlots>=2.0.0",
]

[project.optional-dependencies]
causal-audit = ["causal-audit>=0.3.1"]

[project.urls]
Repository = "https://github.com/marcoruizrueda/autocause"

[tool.setuptools]
packages = [
    "framework",
    "framework.core",
    "framework.core.methods",
    "framework.core.output",
    "framework.core.validation",
    "framework.plots",
    "framework.reporting",
    "framework.config",
]
include-package-data = true

[tool.setuptools.package-data]
"framework.config" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
norecursedirs = ["framework", ".venv", ".git", "experiments", "docs"]
addopts = "-v --tb=short"
